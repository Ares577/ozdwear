name: ozd_wear_app
description: Native Flutter storefront for OZD WEAR.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ozdwear-logo.png
