name: OZD WEAR Android

on:
  workflow_dispatch:
  push:
    paths: ['mobile/ozd_wear_app/**', '.github/workflows/mobile-android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ozd_wear_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Cache Android and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/ozd_wear_app/.dart_tool
          key: ${{ runner.os }}-ozdwear-${{ hashFiles('mobile/ozd_wear_app/pubspec.lock', 'mobile/ozd_wear_app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-ozdwear-
      - name: Create native platform folders when absent
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then flutter create --platforms=android,ios --org com.ozdwear .; fi
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: timeout 15m flutter build apk --debug $FIREBASE_DEFINES
        env:
          FIREBASE_DEFINES: >-
            --dart-define=OZD_FIREBASE_API_KEY=${{ secrets.OZD_FIREBASE_API_KEY }}
            --dart-define=OZD_FIREBASE_PROJECT_ID=${{ secrets.OZD_FIREBASE_PROJECT_ID }}
            --dart-define=OZD_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.OZD_FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=OZD_FIREBASE_ANDROID_APP_ID=${{ secrets.OZD_FIREBASE_ANDROID_APP_ID }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx2g
      - run: timeout 15m flutter build apk --release $FIREBASE_DEFINES
        env:
          FIREBASE_DEFINES: >-
            --dart-define=OZD_FIREBASE_API_KEY=${{ secrets.OZD_FIREBASE_API_KEY }}
            --dart-define=OZD_FIREBASE_PROJECT_ID=${{ secrets.OZD_FIREBASE_PROJECT_ID }}
            --dart-define=OZD_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.OZD_FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=OZD_FIREBASE_ANDROID_APP_ID=${{ secrets.OZD_FIREBASE_ANDROID_APP_ID }}
          OZD_ANDROID_KEYSTORE_BASE64: ${{ secrets.OZD_ANDROID_KEYSTORE_BASE64 }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx2g
      - run: timeout 15m flutter build appbundle --release $FIREBASE_DEFINES
        env:
          FIREBASE_DEFINES: >-
            --dart-define=OZD_FIREBASE_API_KEY=${{ secrets.OZD_FIREBASE_API_KEY }}
            --dart-define=OZD_FIREBASE_PROJECT_ID=${{ secrets.OZD_FIREBASE_PROJECT_ID }}
            --dart-define=OZD_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.OZD_FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=OZD_FIREBASE_ANDROID_APP_ID=${{ secrets.OZD_FIREBASE_ANDROID_APP_ID }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx2g
      - uses: actions/upload-artifact@v4
        with:
          name: OZD-WEAR-Android
          path: |
            mobile/ozd_wear_app/build/app/outputs/flutter-apk/app-debug.apk
            mobile/ozd_wear_app/build/app/outputs/flutter-apk/app-release.apk
            mobile/ozd_wear_app/build/app/outputs/bundle/release/app-release.aab
