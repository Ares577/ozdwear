name: OZD WEAR iOS

on:
  workflow_dispatch:
  push:
    paths: ['mobile/ozd_wear_app/**', '.github/workflows/mobile-ios.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ozd_wear_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Create native platform folders when absent
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.ozdwear .; fi
          rm -f test/widget_test.dart
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build ios --release --no-codesign $FIREBASE_DEFINES
        env:
          FIREBASE_DEFINES: >-
            --dart-define=OZD_FIREBASE_API_KEY=${{ secrets.OZD_FIREBASE_API_KEY }}
            --dart-define=OZD_FIREBASE_PROJECT_ID=${{ secrets.OZD_FIREBASE_PROJECT_ID }}
            --dart-define=OZD_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.OZD_FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=OZD_FIREBASE_IOS_APP_ID=${{ secrets.OZD_FIREBASE_IOS_APP_ID }}
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/OZD-WEAR.app
          cd build/unsigned_ipa
          zip -r ../OZD-WEAR-iOS-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OZD-WEAR-iOS-Unsigned
          path: mobile/ozd_wear_app/build/OZD-WEAR-iOS-Unsigned.ipa
