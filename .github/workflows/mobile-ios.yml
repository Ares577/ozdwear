name: OZD WEAR iOS

on:
  workflow_dispatch:
  push:
    paths: ['mobile/ozd_wear_app/**', '.github/workflows/mobile-ios.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ozd_wear_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Create native platform folders when absent
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org com.ozdwear .; fi
          # Keep the iOS bundle identifier aligned with the registered app.
          sed -i '' 's/com\.ozdwear\.ozdWearApp/com.ozdwear.app/g; s/com\.ozdwear\.ozd_wear_app/com.ozdwear.app/g' ios/Runner.xcodeproj/project.pbxproj
          rm -f test/widget_test.dart
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile
          if [ -n "${{ secrets.OZD_GOOGLE_IOS_CLIENT_ID }}" ]; then
            /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${{ secrets.OZD_GOOGLE_IOS_CLIENT_ID }}" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :GIDClientID ${{ secrets.OZD_GOOGLE_IOS_CLIENT_ID }}" ios/Runner/Info.plist
            IOS_CLIENT_ID="${{ secrets.OZD_GOOGLE_IOS_CLIENT_ID }}"
            IOS_REVERSED_ID="com.googleusercontent.apps.${IOS_CLIENT_ID%.apps.googleusercontent.com}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" ios/Runner/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $IOS_REVERSED_ID" ios/Runner/Info.plist 2>/dev/null || true
          fi
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build ios --release --no-codesign $FIREBASE_DEFINES
        env:
          FIREBASE_DEFINES: >-
            --dart-define=OZD_FIREBASE_API_KEY=${{ secrets.OZD_FIREBASE_API_KEY }}
            --dart-define=OZD_FIREBASE_PROJECT_ID=${{ secrets.OZD_FIREBASE_PROJECT_ID }}
            --dart-define=OZD_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.OZD_FIREBASE_MESSAGING_SENDER_ID }}
            --dart-define=OZD_FIREBASE_IOS_APP_ID=${{ secrets.OZD_FIREBASE_IOS_APP_ID }}
            --dart-define=OZD_GOOGLE_IOS_CLIENT_ID=${{ secrets.OZD_GOOGLE_IOS_CLIENT_ID }}
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned_ipa/Payload/OZD-WEAR.app
          cd build/unsigned_ipa
          # Strip macOS extended attributes from the archive. Some Windows
          # sideloaders reject those extra ZIP records during extraction.
          zip -r -X ../OZD-WEAR-iOS-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OZD-WEAR-iOS-Unsigned
          path: mobile/ozd_wear_app/build/OZD-WEAR-iOS-Unsigned.ipa
